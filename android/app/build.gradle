apply plugin: 'com.android.application'

// AB#4723 (docs/ANDROID.md): the release key comes from the environment, and only from there. Nothing secret is
// in this repository, and a release build without all four variables stops with a message naming the missing ones.
def signingEnv = [
    storeFile    : 'RELIC_VAULT_KEYSTORE_PATH',
    storePassword: 'RELIC_VAULT_KEYSTORE_PASSWORD',
    keyAlias     : 'RELIC_VAULT_KEY_ALIAS',
    keyPassword  : 'RELIC_VAULT_KEY_PASSWORD',
]
def signingValues = signingEnv.collectEntries { field, name -> [field, System.getenv(name) ?: ''] }
def missingSigning = signingEnv.findAll { field, name -> !signingValues[field] }.collect { field, name -> name }

// AB#4732 (docs/RELEASE.md): one version, package.json's. scripts/version.mjs writes versionName and versionCode
// (major*10000 + minor*100 + patch) to android/version.properties on every build and on `npm version`.
def versionProps = new Properties()
def versionFile = file('../version.properties')
if (!versionFile.exists()) throw new GradleException('android/version.properties is missing: run `node scripts/version.mjs` (npm run build does).')
versionFile.withInputStream { versionProps.load(it) }

android {
    namespace = "com.madgod_games.relic_vault"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.madgod_games.relic_vault"
        // AB#4724: the AdMob app id. Google's test app id until the Board supplies the real one (AB#4718), which a
        // release build takes from RELIC_VAULT_ADMOB_APP_ID (a Gradle property or the environment), like the signing.
        def admobAppId = project.findProperty('RELIC_VAULT_ADMOB_APP_ID') ?: System.getenv('RELIC_VAULT_ADMOB_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713'
        manifestPlaceholders += [admobAppId: admobAppId]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode(versionProps.getProperty('versionCode') as Integer)
        versionName versionProps.getProperty('versionName')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (!missingSigning) {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // AB#4723: MainActivity uses these directly (EdgeToEdge, WebViewCompat); Capacitor keeps its own copies private
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// AB#4723: refuse to build an unsigned or wrongly signed release, before any work starts.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { it.project == project && it.name ==~ /(bundle|assemble|package|sign)Release.*/ }
    if (!releaseTask) return
    if (missingSigning) {
        throw new GradleException("A release build is signed with the upload key, from the environment only. Set " +
            missingSigning.join(', ') + " (docs/ANDROID.md, 'Signing'). Nothing is read from files in the repository.")
    }
    if (!file(signingValues.storeFile).isFile()) {
        throw new GradleException("RELIC_VAULT_KEYSTORE_PATH does not name a keystore file that exists (docs/ANDROID.md, 'Signing').")
    }
    // AB#4712: ads.ts holds the live ad units, which serve nothing under Google's test app id (the default above)
    def releaseAdmobAppId = project.findProperty('RELIC_VAULT_ADMOB_APP_ID') ?: System.getenv('RELIC_VAULT_ADMOB_APP_ID')
    if (!releaseAdmobAppId || releaseAdmobAppId.startsWith('ca-app-pub-3940256099942544')) {
        throw new GradleException("A release build needs the live AdMob app id: set RELIC_VAULT_ADMOB_APP_ID to the app id in " +
            "apps/web/src/game/config/ads.ts (docs/ANDROID.md, 'Ads'). With Google's test app id the live ad units serve nothing.")
    }
    // Bug #4894: the web app decides AdMob or the demo veil when it is built (VITE_ADS_MODE); scripts/version.mjs records
    // which in version.properties. A release that would show players the demo veil instead of ads stops here.
    if (versionProps.getProperty('adsMode') != 'admob') {
        throw new GradleException("A release build needs the web app built with VITE_ADS_MODE=admob, or players see the demo veil and " +
            "no real ad: npm run android:bundle sets it (docs/ANDROID.md, 'Ads'). version.properties says adsMode=" +
            (versionProps.getProperty('adsMode') ?: 'nothing (built before Bug #4894)') + ".")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
