<!doctype html>
<html><head><meta charset="utf-8"><title>icon baker</title></head>
<body style="margin:0;background:#111">
<script type="module">
  import { paintRelic } from '../src/game/art/RelicFactory.ts';
  import { makeCanvas, rad, glow, chrome, MAT, lin } from '../src/game/art/paint.ts';
  import { paintFar } from '../src/game/art/VaultBackground.ts';
  import '@fontsource/cinzel/900.css';

  function icon(size, maskable) {
    const [c, ctx] = makeCanvas(size, size);
    const s = size / 512;
    ctx.fillStyle = rad(ctx, 256 * s, 220 * s, 20 * s, 380 * s, [[0, '#4a1838'], [0.55, '#1B1424'], [1, '#07060B']]);
    ctx.fillRect(0, 0, size, size);
    glow(ctx, 256 * s, 256 * s, 260 * s, 'rgba(244,196,90,0.45)');
    const r = (maskable ? 170 : 205) * s;
    ctx.lineWidth = 16 * s; ctx.strokeStyle = chrome(ctx, MAT.gold, 0, 256 * s - r, 0, 256 * s + r);
    ctx.beginPath(); ctx.arc(256 * s, 256 * s, r, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 3 * s; ctx.strokeStyle = '#2a1402';
    ctx.beginPath(); ctx.arc(256 * s, 256 * s, r + 9 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(256 * s, 256 * s, r - 9 * s, 0, Math.PI * 2); ctx.stroke();
    const [rc, rctx] = makeCanvas(256, 256);
    paintRelic(rctx, 4, true);
    const d = (maskable ? 300 : 370) * s;
    ctx.save(); ctx.shadowColor = 'rgba(255,190,80,0.7)'; ctx.shadowBlur = 30 * s;
    ctx.drawImage(rc, 256 * s - d / 2, 256 * s - d / 2 - 6 * s, d, d); ctx.restore();
    return c.toDataURL('image/png');
  }
  /*
   * AB#4729: Google Play's feature graphic, 1024x500: the vault's back wall, the Ruby Crown lit on the right, the
   * wordmark on the left, and no small text (Play crops and overlays it at many sizes). make-icons.mjs writes it as a
   * 24-bit PNG, as Play asks.
   */
  function feature() {
    const [c, ctx] = makeCanvas(1024, 500);
    const [bg, bctx] = makeCanvas(1080, 1920);
    paintFar(bctx);
    ctx.drawImage(bg, 0, 250, 1080, 527, 0, 0, 1024, 500);
    ctx.fillStyle = lin(ctx, 0, 0, 1024, 0, [[0, 'rgba(7,6,11,0.88)'], [0.5, 'rgba(7,6,11,0.45)'], [1, 'rgba(7,6,11,0.15)']]);
    ctx.fillRect(0, 0, 1024, 500);
    glow(ctx, 770, 255, 300, 'rgba(244,196,90,0.55)');
    const [rc, rctx] = makeCanvas(256, 256);
    paintRelic(rctx, 7, true);
    ctx.save(); ctx.shadowColor = 'rgba(255,190,80,0.8)'; ctx.shadowBlur = 40;
    ctx.drawImage(rc, 770 - 210, 255 - 215, 420, 420); ctx.restore();
    const gold = lin(ctx, 0, 150, 0, 360, [[0, '#FFF6CF'], [0.55, '#F4C45A'], [1, '#A56A12']]);
    ctx.font = '900 118px Cinzel';
    ctx.textBaseline = 'alphabetic';
    for (const [word, y] of [['RELIC', 232], ['VAULT', 360]]) {
      ctx.lineWidth = 10; ctx.strokeStyle = '#1a0c02'; ctx.lineJoin = 'round';
      ctx.strokeText(word, 64, y);
      ctx.fillStyle = gold; ctx.fillText(word, 64, y);
    }
    return c.toDataURL('image/png');
  }
  await document.fonts.load('900 118px Cinzel');
  window.__store = {
    'icon-512.png': icon(512, false), // Play: 512x512, 32-bit PNG, full bleed; Play applies its own mask
    'feature-graphic-1024x500.png': feature(),
  };
  window.__icons = {
    'icon-192.png': icon(192, false),
    'icon-512.png': icon(512, false),
    'icon-maskable-512.png': icon(512, true),
    'apple-touch-icon.png': icon(180, false),
  };
</script>
</body></html>
