<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relic Vault — invite only</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0b0710; color: #e8dcf0;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  .card { max-width: 30rem; text-align: center; background: #150e1d; border: 1px solid #2c1f3a; border-radius: 18px; padding: 32px; }
  h1 { font-size: 24px; margin: 0 0 12px; color: #f4c45a; }
  p { color: #b9a9c6; margin: 0 0 16px; }
  a { color: #7ee0ff; }
</style>
</head>
<body>
  <main class="card">
    <h1>Relic Vault is in a closed playtest</h1>
    <p>You're signed in, but this account hasn't been invited yet. If you were expecting access, ask for an invite and sign in again.</p>
    <p><a href="/.auth/logout">Sign out</a></p>
  </main>
</body>
</html>
